<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Youssef & Arwa 🤍</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Amiri:ital@0;1&display=swap" rel="stylesheet">

<style>
:root {
    --gold-primary: #d4af37;
    --gold-light: #f3e5ab;
    --rose-gold: #e8c39e;
    --deep-wine: #2b0d18;
    --text-color: #4a232e;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family: 'Playfair Display', Georgia, serif;
    color: var(--text-color);
    background: radial-gradient(circle at center, #fffcfb 0%, #f7e1e6 50%, #dca3b1 100%);
}

/* =========================
   CURTAINS
========================= */
.curtain-container{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    pointer-events:none;
}

.curtain{
    width:50%;
    height:100%;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.05) 0px,
            rgba(255,255,255,.05) 12px,
            rgba(0,0,0,.12) 25px,
            rgba(255,255,255,.02) 40px
        ),
        linear-gradient(
            90deg,
            #1e070e,
            #4a1525 30%,
            #6b2237 50%,
            #4a1525 70%,
            #1e070e
        );
    box-shadow: inset 0 0 120px rgba(0,0,0,.8);
    position: relative;
}

.curtain-left {
    border-right: 2px solid rgba(212, 175, 55, 0.4);
    animation: openLeft 2.4s cubic-bezier(0.77, 0, 0.175, 1) 0.8s forwards;
}

.curtain-right {
    border-left: 2px solid rgba(212, 175, 55, 0.4);
    animation: openRight 2.4s cubic-bezier(0.77, 0, 0.175, 1) 0.8s forwards;
}

/* =========================
   MAIN PAGE
========================= */
.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    position:relative;
}

.content{
    position:relative;
    z-index:5;
    max-width:900px;
    opacity:0;
    animation: showContent 1.8s ease 1.8s forwards;
}

.small-title{
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 7px;
    text-transform: uppercase;
    color: #8c4a5c;
    margin-bottom: 20px;
    font-weight: 600;
}

h1{
    font-size: clamp(50px, 9vw, 100px);
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 15px;
    background: linear-gradient(135deg, #4a1525 0%, #8c3b52 50%, #4a1525 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.ampersand{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #c47b8c;
    -webkit-text-fill-color: initial;
    display: inline-block;
    padding: 0 10px;
}

.date{
    font-family: 'Cinzel', serif;
    font-size: clamp(18px, 3.5vw, 28px);
    letter-spacing: 8px;
    color: #6e3243;
    margin-bottom: 25px;
    font-weight: 600;
}

.message{
    font-size: clamp(16px, 2.5vw, 22px);
    line-height: 1.8;
    font-style: italic;
    max-width: 650px;
    margin: 0 auto 20px auto;
    color: #5c2c3a;
}

.story{
    font-family: 'Amiri', serif;
    font-size: 20px;
    letter-spacing: 1px;
    color: #7a3e50;
    margin-top: 10px;
}

/* =========================
   COUNTDOWN
========================= */
.countdown{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:40px;
    flex-wrap:wrap;
}

.time-box{
    min-width: 100px;
    padding: 18px 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 
        0 15px 35px rgba(110, 50, 67, 0.08),
        inset 0 0 15px rgba(255, 255, 255, 0.6);
    transition: transform 0.3s ease;
}

.time-box:hover {
    transform: translateY(-5px);
}

.number{
    display:block;
    font-family: 'Cinzel', serif;
    font-size: 32px;
    font-weight: 700;
    color: #4a1525;
}

.label{
    display:block;
    margin-top: 6px;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 3px;
    color: #8c4a5c;
    font-weight: 600;
}

/* =========================
   STARS & HEARTS
========================= */
.stars, .hearts {
    position:fixed;
    inset:0;
    pointer-events:none;
}

.stars { z-index: 1; }
.hearts { z-index: 2; overflow: hidden; }

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    box-shadow: 0 0 8px #fff;
    opacity:.5;
    animation:twinkle 3s infinite alternate;
}

.star:nth-child(1){left:10%;top:20%;animation-delay:.2s}
.star:nth-child(2){left:20%;top:75%;animation-delay:1s}
.star:nth-child(3){left:30%;top:30%;animation-delay:1.7s}
.star:nth-child(4){left:45%;top:15%;animation-delay:.5s}
.star:nth-child(5){left:60%;top:80%;animation-delay:1.4s}
.star:nth-child(6){left:75%;top:25%;animation-delay:.8s}
.star:nth-child(7){left:85%;top:65%;animation-delay:2s}
.star:nth-child(8){left:95%;top:35%;animation-delay:1.2s}

.heart{
    position:absolute;
    bottom:-40px;
    color:#c47b8c;
    opacity:0;
    font-size:18px;
    animation:floatUp linear infinite;
}

.heart:nth-child(1){ left:10%; animation-duration:11s; animation-delay:1s; }
.heart:nth-child(2){ left:25%; animation-duration:14s; animation-delay:3s; }
.heart:nth-child(3){ left:45%; animation-duration:12s; animation-delay:2s; }
.heart:nth-child(4){ left:65%; animation-duration:15s; animation-delay:5s; }
.heart:nth-child(5){ left:80%; animation-duration:13s; animation-delay:4s; }
.heart:nth-child(6){ left:92%; animation-duration:16s; animation-delay:6s; }

/* =========================
   MUSIC BUTTON
========================= */
.music-button{
    position:fixed;
    right:30px;
    bottom:30px;
    z-index:20;
    width:60px;
    height:60px;
    border:1px solid rgba(255,255,255,0.8);
    border-radius:50%;
    background:rgba(255, 255, 255, 0.5);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    color:#5c2c3a;
    font-size:20px;
    cursor:pointer;
    box-shadow: 0 10px 30px rgba(70,35,50,0.15);
    transition: all 0.4s ease;
    display: flex;
    justify-content: center;
    align-items: center;
}

.music-button:hover{
    transform:scale(1.1);
    background:rgba(255, 255, 255, 0.8);
    box-shadow: 0 12px 35px rgba(70,35,50,0.25);
}

/* =========================
   ANIMATIONS
========================= */
@keyframes openLeft{
    from{transform:translateX(0)}
    to{transform:translateX(-100%)}
}

@keyframes openRight{
    from{transform:translateX(0)}
    to{transform:translateX(100%)}
}

@keyframes showContent{
    from{
        opacity:0;
        transform:scale(0.96) translateY(20px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

@keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    15%{ opacity:.6; }
    85%{ opacity:.2; }
    100%{ transform:translateY(-115vh) rotate(360deg); opacity:0; }
}

@keyframes twinkle{
    from{ opacity:.2; transform:scale(.8); }
    to{ opacity:.9; transform:scale(1.4); }
}

/* =========================
   MOBILE RESPONSIVE
========================= */
@media(max-width:600px){
    .small-title{ font-size:10px; letter-spacing:4px; }
    .date{ letter-spacing:4px; }
    .message{ font-size:16px; }
    .countdown{ gap:8px; }
    .time-box{ min-width:75px; padding:12px 8px; }
    .number{ font-size:22px; }
    .label{ font-size:8px; letter-spacing:1.5px; }
    .music-button{ right:20px; bottom:20px; width:50px; height:50px; font-size:18px; }
}
</style>
</head>

<body>

<!-- CURTAINS -->
<div class="curtain-container">
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>
</div>

<!-- STARS -->
<div class="stars">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
</div>

<!-- HEARTS -->
<div class="hearts">
    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♥</div>
    <div class="heart">♡</div>
    <div class="heart">♥</div>
    <div class="heart">♡</div>
</div>

<!-- MAIN CONTENT -->
<main class="page">
    <div class="content">
        <div class="small-title">With Love, From Two Hearts</div>

        <h1>Youssef <span class="ampersand">&</span> Arwa</h1>

        <div class="date">16 · 10 · 2026</div>

        <p class="message">
            We fall in love in October.<br>
            And on this beautiful day, a new chapter begins...
        </p>

        <div class="story">
            بِسْمِ اللَّهِ نَبْدَأُ حِكَايَتَنَا 🤍
        </div>

        <!-- COUNTDOWN -->
        <div class="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">DAYS</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">HOURS</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">MINUTES</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">SECONDS</span>
            </div>
        </div>
    </div>
</main>

<!-- MUSIC BUTTON -->
<button class="music-button" id="musicButton" aria-label="Play Music">♫</button>

<script>
/* =====================================
   COUNTDOWN ENGINE
===================================== */
const targetDate = new Date("October 16, 2026 20:00:00").getTime();

function updateCountdown(){
    const now = new Date().getTime();
    const distance = targetDate - now;

    if(distance <= 0){
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").textContent = String(days).padStart(2,"0");
    document.getElementById("hours").textContent = String(hours).padStart(2,"0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2,"0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2,"0");
}

updateCountdown();
setInterval(updateCountdown, 1000);

/* =====================================
   ROMANTIC MUSIC ENGINE
===================================== */
let audioContext = null;
let master = null;
let musicTimer = null;
let playing = false;

const notes = {
    C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00,
    C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
    C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00
};

function piano(note, duration, time){
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "triangle";
    osc.frequency.value = notes[note];

    gain.gain.setValueAtTime(0.001, time);
    gain.gain.exponentialRampToValueAtTime(0.14, time + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

    osc.connect(gain);
    gain.connect(master);

    osc.start(time);
    osc.stop(time + duration + 0.1);
}

function strings(note, duration, time){
    const osc1 = audioContext.createOscillator();
    const osc2 = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc1.type = "sine";
    osc2.type = "sine";

    osc1.frequency.value = notes[note];
    osc2.frequency.value = notes[note] * 1.005;

    gain.gain.setValueAtTime(0.001, time);
    gain.gain.linearRampToValueAtTime(0.035, time + 0.5);
    gain.gain.linearRampToValueAtTime(0.001, time + duration);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(master);

    osc1.start(time);
    osc2.start(time);

    osc1.stop(time + duration);
    osc2.stop(time + duration);
}

function pad(chord, duration, time){
    chord.forEach(note => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = "sine";
        osc.frequency.value = notes[note];

        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(0.018, time + 1);
        gain.gain.linearRampToValueAtTime(0.001, time + duration);

        osc.connect(gain);
        gain.connect(master);

        osc.start(time);
        osc.stop(time + duration);
    });
}

const melody = [
    ["A4",.45], ["C5",.45], ["E5",.75],
    ["D5",.45], ["C5",.45], ["A4",.8],
    ["G4",.45], ["B4",.45], ["D5",.75],
    ["C5",.45], ["B4",.45], ["G4",.8],
    ["A4",.45], ["C5",.45], ["E5",.75],
    ["F5",.45], ["E5",.45], ["C5",.8],
    ["D5",.45], ["C5",.45], ["A4",1.1]
];

const chords = [
    ["A3","C4","E4"],
    ["F3","A3","C4"],
    ["G3","B4","D4"],
    ["C3","E3","G3"]
];

function playMusic(){
    let time = audioContext.currentTime + 0.15;
    let chordIndex = 0;

    melody.forEach(([note, duration], index) => {
        piano(note, duration, time);
        strings(note, duration + 0.5, time);

        if(index % 6 === 0){
            pad(chords[chordIndex], 3.5, time);
            chordIndex = (chordIndex + 1) % chords.length;
        }
        time += duration;
    });

    musicTimer = setTimeout(playMusic, (time - audioContext.currentTime) * 1000);
}

function startMusic(){
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    master = audioContext.createGain();
    master.gain.value = 0.75;
    master.connect(audioContext.destination);

    playMusic();
    playing = true;
    document.getElementById("musicButton").textContent = "❚❚";
}

function stopMusic(){
    clearTimeout(musicTimer);
    if(audioContext){
        audioContext.close();
        audioContext = null;
    }
    playing = false;
    document.getElementById("musicButton").textContent = "♫";
}

document.getElementById("musicButton").addEventListener("click", () => {
    if(!playing){
        startMusic();
    }else{
        stopMusic();
    }
});
</script>

</body>
</html>
